<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redfish Fleet Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Redfish Fleet Monitor</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="alertsBtn" title="Alerts">
        <i class="fa-solid fa-bell"></i>
        <span class="badge" id="alertsBadge" style="display:none;">0</span>
      </button>
      <span id="wsStatus" class="pill pill-unknown"><span class="dot"></span> connecting</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="serverSearch" placeholder="Search servers...">
      <button class="btn-primary" id="addServerBtn" title="Add server"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="server-list" id="serverList">
      <div class="sidebar-empty">No servers yet. Click + to add one.</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="main">
    <div class="no-server-selected">
      <i class="fa-solid fa-server" style="font-size: 32px;"></i>
      <div>Select a server to view its hardware status</div>
    </div>
  </div>

</div>

<!-- Alerts drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="alertsDrawer">
  <div class="drawer-header">
    <h2>Alerts</h2>
    <button class="icon-btn" id="closeDrawerBtn"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="drawer-body" id="alertsList"></div>
</div>

<!-- Add server modal -->
<div class="modal-overlay" id="addServerModal">
  <div class="modal">
    <h2>Add server</h2>
    <div class="field"><label>Hostname / Display name</label><input id="f_hostname" placeholder="web-node-042"></div>
    <div class="field"><label>BMC IP address</label><input id="f_ip" placeholder="10.20.30.40"></div>
    <div class="field"><label>Username</label><input id="f_username" placeholder="root"></div>
    <div class="field"><label>Password</label><input id="f_password" type="password"></div>
    <div class="field"><label>Polling interval (seconds)</label><input id="f_interval" value="30"></div>
    <div class="modal-error" id="addServerError" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelAddServer">Cancel</button>
      <button class="btn-primary" id="submitAddServer">Add server</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
